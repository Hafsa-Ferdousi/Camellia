<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart – Camellia</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0eef5;
      color: #1a1a2e;
    }

    /* ── Navbar ── */
    .navbar {
      background-color: #1a1a2e;
      padding: 18px 28px;
    }

    .navbar-brand {
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* ── Page Wrapper ── */
    .page-wrapper {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 16px 60px;
    }

    .cart-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #1a1a2e;
    }

    /* ── Cart Item Card ── */
    .cart-item {
      background: #ffffff;
      border-radius: 10px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .item-image {
      width: 90px;
      height: 90px;
      background: #ddd8cc;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 12px;
      flex-shrink: 0;
    }

    .item-details {
      flex: 1;
    }

    .item-name {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #1a1a2e;
    }

    .item-unit-price {
      font-size: 14px;
      font-weight: 600;
      color: #b8860b;
      margin-bottom: 10px;
    }

    /* Quantity Controls */
    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .qty-btn {
      width: 30px;
      height: 30px;
      border: 1.5px solid #ccc;
      background: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .qty-btn:hover { background: #f0eef5; }

    .qty-btn.minus { border-radius: 6px 0 0 6px; }
    .qty-btn.plus  { border-radius: 0 6px 6px 0; }

    .qty-display {
      width: 40px;
      height: 30px;
      border: 1.5px solid #ccc;
      border-left: none;
      border-right: none;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Item right side */
    .item-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
    }

    .item-total-price {
      font-size: 15px;
      font-weight: 700;
      color: #1a1a2e;
    }

    .remove-btn {
      background: none;
      border: none;
      color: #e53935;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }

    .remove-btn:hover { text-decoration: underline; }

    /* ── Empty Cart ── */
    .empty-cart {
      display: none;
      text-align: center;
      padding: 60px 20px;
      color: #888;
      font-size: 16px;
      background: #fff;
      border-radius: 10px;
      margin-bottom: 14px;
    }

    /* ── Order Summary ── */
    .order-summary {
      background: #ffffff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-top: 10px;
    }

    .summary-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #1a1a2e;
    }

    .summary-divider {
      border: none;
      border-top: 1px solid #e0ddd5;
      margin-bottom: 14px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #444;
      margin-bottom: 10px;
    }

    .summary-row .free {
      color: #2e7d32;
      font-weight: 600;
    }

    .summary-row.total {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a2e;
      margin-top: 6px;
      padding-top: 10px;
      border-top: 1px solid #e0ddd5;
    }

    /* Coupon Input */
    .coupon-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      margin: 16px 0 14px;
      outline: none;
      color: #444;
    }

    .coupon-input:focus {
      border-color: #b8860b;
    }

    /* Checkout Button */
    .checkout-btn {
      width: 100%;
      padding: 14px;
      background: #b8860b;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      letter-spacing: 0.5px;
    }

    .checkout-btn:hover { background: #9a7009; }

    /* Continue Shopping */
    .continue-shopping {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 13px;
      color: #888;
      cursor: pointer;
      text-decoration: none;
    }

    .continue-shopping:hover { color: #1a1a2e; }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .cart-item { flex-wrap: wrap; }
      .item-right { flex-direction: row; justify-content: space-between; width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <span class="navbar-brand">Camellia</span>
  </nav>

  <!-- Page Content -->
  <div class="page-wrapper">

    <h2 class="cart-title" id="cartTitle">Your Cart (2 items)</h2>

    <!-- Cart Items -->
    <div id="cartItems">

      <!-- Item 1 -->
      <div class="cart-item" id="item-1">
        <div class="item-image">img</div>
        <div class="item-details">
          <div class="item-name">Kalira Set</div>
          <div class="item-unit-price" data-price="2400">৳ 2,400</div>
          <div class="quantity-controls">
            <button class="qty-btn minus" onclick="changeQty('item-1', -1)">−</button>
            <div class="qty-display" id="qty-item-1">1</div>
            <button class="qty-btn plus" onclick="changeQty('item-1', 1)">+</button>
          </div>
        </div>
        <div class="item-right">
          <div class="item-total-price" id="total-item-1">৳ 2,400</div>
          <button class="remove-btn" onclick="removeItem('item-1')">Remove</button>
        </div>
      </div>

      <!-- Item 2 -->
      <div class="cart-item" id="item-2">
        <div class="item-image">img</div>
        <div class="item-details">
          <div class="item-name">Bridal Chura</div>
          <div class="item-unit-price" data-price="4800">৳ 4,800</div>
          <div class="quantity-controls">
            <button class="qty-btn minus" onclick="changeQty('item-2', -1)">−</button>
            <div class="qty-display" id="qty-item-2">2</div>
            <button class="qty-btn plus" onclick="changeQty('item-2', 1)">+</button>
          </div>
        </div>
        <div class="item-right">
          <div class="item-total-price" id="total-item-2">৳ 9,600</div>
          <button class="remove-btn" onclick="removeItem('item-2')">Remove</button>
        </div>
      </div>

    </div>

    <!-- Empty Cart Message -->
    <div class="empty-cart" id="emptyCart">
      🛒 Your cart is empty!
    </div>

    <!-- Order Summary -->
    <div class="order-summary">
      <div class="summary-title">Order Summary</div>
      <hr class="summary-divider"/>
      <div class="summary-row">
        <span id="subtotalLabel">Subtotal (3 items)</span>
        <span id="subtotalAmount">৳ 12,000</span>
      </div>
      <div class="summary-row">
        <span>Delivery</span>
        <span class="free">Free</span>
      </div>
      <div class="summary-row total">
        <span>Total</span>
        <span id="totalAmount">৳ 12,000</span>
      </div>

      <input type="text" class="coupon-input" placeholder="Enter coupon code (optional)" />

      <button class="checkout-btn" onclick="checkout()">Checkout</button>
      <a class="continue-shopping" href="category-section.html">Continue Shopping</a>
    </div>

  </div>

  <script>
    // ── Cart Data ──
    const cartData = {
      'item-1': { qty: 1, price: 2400 },
      'item-2': { qty: 2, price: 4800 }
    };

    // ── Change Quantity ──
    function changeQty(itemId, change) {
      const item = cartData[itemId];
      item.qty += change;

      // Minimum quantity is 1
      if (item.qty < 1) item.qty = 1;

      // Update quantity display
      document.getElementById('qty-' + itemId).textContent = item.qty;

      // Update item total price
      const itemTotal = item.qty * item.price;
      document.getElementById('total-' + itemId).textContent = '৳ ' + itemTotal.toLocaleString();

      // Update order summary
      updateSummary();
    }

    // ── Remove Item ──
    function removeItem(itemId) {
      const itemEl = document.getElementById(itemId);
      itemEl.remove();
      delete cartData[itemId];
      updateSummary();
    }

    // ── Update Order Summary ──
    function updateSummary() {
      let subtotal = 0;
      let totalQty = 0;

      for (const itemId in cartData) {
        const item = cartData[itemId];
        subtotal += item.qty * item.price;
        totalQty += item.qty;
      }

      // Update subtotal and total
      document.getElementById('subtotalAmount').textContent = '৳ ' + subtotal.toLocaleString();
      document.getElementById('totalAmount').textContent = '৳ ' + subtotal.toLocaleString();
      document.getElementById('subtotalLabel').textContent = 'Subtotal (' + totalQty + ' items)';

      // Update cart title
      const itemCount = Object.keys(cartData).length;
      document.getElementById('cartTitle').textContent = 'Your Cart (' + itemCount + ' items)';

      // Show empty cart message if no items
      if (itemCount === 0) {
        document.getElementById('emptyCart').style.display = 'block';
        document.getElementById('cartTitle').textContent = 'Your Cart (0 items)';
      } else {
        document.getElementById('emptyCart').style.display = 'none';
      }
    }

    // ── Checkout ──
    function checkout() {
      const itemCount = Object.keys(cartData).length;
      if (itemCount === 0) {
        alert('Your cart is empty! Please add items first.');
        return;
      }
      alert('Proceeding to checkout! Total: ' + document.getElementById('totalAmount').textContent);
    }

    // Initialize summary on page load
    updateSummary();
  </script>

</body>
</html>
